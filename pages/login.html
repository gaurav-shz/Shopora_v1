<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login – Shopora</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    .auth-wrap {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px;
      background:
        radial-gradient(ellipse 50% 60% at 80% 20%, rgba(168,85,247,.12) 0%, transparent 70%),
        radial-gradient(ellipse 40% 50% at 10% 80%, rgba(6,182,212,.08) 0%, transparent 70%),
        var(--bg);
    }
    .auth-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 24px; padding: 40px; width: 100%; max-width: 420px;
      animation: fadeUp .5s ease both;
    }
    .auth-logo { font-family: var(--fh); font-size: 28px; font-weight: 800; margin-bottom: 8px; }
    .auth-logo span { color: var(--accent1); }
    .auth-sub { font-size: 14px; color: var(--muted); margin-bottom: 32px; }

    .auth-field { margin-bottom: 16px; }
    .auth-label { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; display: block; margin-bottom: 8px; }
    .auth-input {
      width: 100%; background: var(--surface); border: 1px solid var(--border);
      color: var(--text); padding: 13px 16px; border-radius: 12px;
      font-family: var(--fb); font-size: 14px; outline: none;
      transition: border-color .3s, box-shadow .3s;
    }
    .auth-input:focus { border-color: var(--accent1); box-shadow: 0 0 0 3px rgba(249,115,22,.1); }
    .auth-input::placeholder { color: var(--muted); }

    .auth-input-wrap { position: relative; }
    .toggle-pw {
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--muted); cursor: pointer; font-size: 18px;
      transition: color .2s;
    }
    .toggle-pw:hover { color: var(--text); }

    .auth-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; font-size: 13px; }
    .auth-row a { color: var(--accent2); transition: color .2s; }
    .auth-row a:hover { color: var(--text); }
    .remember { display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--muted); }
    .remember input { accent-color: var(--accent1); }

    .auth-btn {
      width: 100%; padding: 14px; border-radius: 12px;
      background: var(--accent1); color: #fff;
      font-family: var(--fh); font-size: 16px; font-weight: 700;
      border: none; cursor: pointer;
      box-shadow: 0 8px 28px rgba(249,115,22,.3);
      transition: transform .2s, box-shadow .2s;
    }
    .auth-btn:hover { transform: translateY(-2px); box-shadow: 0 14px 36px rgba(249,115,22,.5); }

    .auth-divider { display: flex; align-items: center; gap: 12px; margin: 24px 0; }
    .auth-divider hr { flex: 1; border: none; border-top: 1px solid var(--border); }
    .auth-divider span { font-size: 12px; color: var(--muted); white-space: nowrap; }

    .social-btns { display: flex; gap: 10px; }
    .social-btn {
      flex: 1; padding: 11px; border-radius: 12px;
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text); font-size: 13px; font-weight: 600;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: border-color .2s, background .2s;
    }
    .social-btn:hover { border-color: var(--muted); background: rgba(255,255,255,.04); }

    .auth-switch { text-align: center; margin-top: 24px; font-size: 13px; color: var(--muted); }
    .auth-switch a { color: var(--accent1); font-weight: 600; }
    .auth-switch a:hover { text-decoration: underline; }

    .error-msg {
      background: rgba(239,68,68,.08); border: 1px solid rgba(239,68,68,.2);
      color: #ef4444; font-size: 13px; padding: 10px 14px; border-radius: 10px;
      margin-bottom: 16px; display: none;
    }
  </style>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo">Sho<span>pora</span></div>
      <p class="auth-sub">Welcome back! Sign in to your account</p>

      <div class="error-msg" id="errorMsg">Invalid email or password. Try again.</div>

      <div class="auth-field">
        <label class="auth-label">Email</label>
        <input type="email" id="emailInput" class="auth-input" placeholder="you@example.com"/>
      </div>

      <div class="auth-field">
        <label class="auth-label">Password</label>
        <div class="auth-input-wrap">
          <input type="password" id="passInput" class="auth-input" placeholder="Enter your password" style="padding-right:46px"/>
          <button class="toggle-pw" onclick="togglePw()" type="button">
            <i class='bx bx-hide' id="eyeIcon"></i>
          </button>
        </div>
      </div>

      <div class="auth-row">
        <label class="remember">
          <input type="checkbox"/> Remember me
        </label>
        <a href="#">Forgot password?</a>
      </div>

      <button class="auth-btn" onclick="doLogin()">Sign In</button>

      <div class="auth-divider">
        <hr/><span>or continue with</span><hr/>
      </div>

      <div class="social-btns">
        <button class="social-btn" onclick="showToast('🔵 Google login coming soon!')">
          <i class='bx bxl-google' style="color:#ea4335;font-size:18px"></i> Google
        </button>
        <button class="social-btn" onclick="showToast('🔵 Facebook login coming soon!')">
          <i class='bx bxl-facebook' style="color:#1877f2;font-size:18px"></i> Facebook
        </button>
      </div>

      <div class="auth-switch">
        Don't have an account? <a href="register.html">Sign up free</a>
      </div>
    </div>
  </div>

  <script src="../js/main.js"></script>
  <script>
    function togglePw() {
      const inp  = document.getElementById("passInput");
      const icon = document.getElementById("eyeIcon");
      if (inp.type === "password") {
        inp.type = "text";
        icon.classList.replace("bx-hide", "bx-show");
      } else {
        inp.type = "password";
        icon.classList.replace("bx-show", "bx-hide");
      }
    }

    function doLogin() {
      const email = document.getElementById("emailInput").value.trim();
      const pass  = document.getElementById("passInput").value;
      const err   = document.getElementById("errorMsg");
      if (!email || !pass) { err.style.display = "block"; err.textContent = "Please fill in all fields."; return; }
      // Demo login — accept anything
      showToast("✅ Logged in successfully!");
      err.style.display = "none";
      setTimeout(() => window.location.href = "../index.html", 1000);
    }
  </script>
</body>
</html>

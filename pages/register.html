<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register – Shopora</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    .auth-wrap {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px;
      background:
        radial-gradient(ellipse 50% 60% at 80% 20%, rgba(168,85,247,.12) 0%, transparent 70%),
        radial-gradient(ellipse 40% 50% at 10% 80%, rgba(6,182,212,.08) 0%, transparent 70%),
        var(--bg);
    }
    .auth-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 24px; padding: 40px; width: 100%; max-width: 440px;
      animation: fadeUp .5s ease both;
    }
    .auth-logo { font-family: var(--fh); font-size: 28px; font-weight: 800; margin-bottom: 8px; }
    .auth-logo span { color: var(--accent1); }
    .auth-sub  { font-size: 14px; color: var(--muted); margin-bottom: 28px; }

    .auth-field { margin-bottom: 14px; }
    .auth-label { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; display: block; margin-bottom: 7px; }
    .auth-input {
      width: 100%; background: var(--surface); border: 1px solid var(--border);
      color: var(--text); padding: 12px 16px; border-radius: 12px;
      font-family: var(--fb); font-size: 14px; outline: none;
      transition: border-color .3s, box-shadow .3s;
    }
    .auth-input:focus { border-color: var(--accent1); box-shadow: 0 0 0 3px rgba(249,115,22,.1); }
    .auth-input::placeholder { color: var(--muted); }

    .name-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .auth-btn {
      width: 100%; padding: 14px; border-radius: 12px;
      background: var(--accent1); color: #fff;
      font-family: var(--fh); font-size: 16px; font-weight: 700;
      border: none; cursor: pointer; margin-top: 8px;
      box-shadow: 0 8px 28px rgba(249,115,22,.3);
      transition: transform .2s, box-shadow .2s;
    }
    .auth-btn:hover { transform: translateY(-2px); box-shadow: 0 14px 36px rgba(249,115,22,.5); }

    .terms-note { font-size: 12px; color: var(--muted); text-align: center; margin-top: 14px; }
    .terms-note a { color: var(--accent2); }

    .auth-switch { text-align: center; margin-top: 20px; font-size: 13px; color: var(--muted); }
    .auth-switch a { color: var(--accent1); font-weight: 600; }

    .strength-bar { height: 4px; border-radius: 99px; background: var(--border); margin-top: 8px; overflow: hidden; }
    .strength-fill { height: 100%; border-radius: 99px; width: 0; transition: width .4s, background .4s; }
    .strength-text { font-size: 11px; color: var(--muted); margin-top: 4px; }
  </style>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo">Sho<span>pora</span></div>
      <p class="auth-sub">Create your free account and start saving</p>

      <div class="name-row">
        <div class="auth-field">
          <label class="auth-label">First Name</label>
          <input type="text" id="firstName" class="auth-input" placeholder="Rahul"/>
        </div>
        <div class="auth-field">
          <label class="auth-label">Last Name</label>
          <input type="text" id="lastName" class="auth-input" placeholder="Sharma"/>
        </div>
      </div>

      <div class="auth-field">
        <label class="auth-label">Email</label>
        <input type="email" id="regEmail" class="auth-input" placeholder="you@example.com"/>
      </div>

      <div class="auth-field">
        <label class="auth-label">Phone</label>
        <input type="tel" id="regPhone" class="auth-input" placeholder="+91 98765 43210"/>
      </div>

      <div class="auth-field">
        <label class="auth-label">Password</label>
        <input type="password" id="regPass" class="auth-input" placeholder="Create a strong password" oninput="checkStrength(this.value)"/>
        <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
        <div class="strength-text" id="strengthText">Enter a password</div>
      </div>

      <button class="auth-btn" onclick="doRegister()">Create Account</button>

      <p class="terms-note">
        By signing up you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
      </p>
      <div class="auth-switch">
        Already have an account? <a href="login.html">Sign in</a>
      </div>
    </div>
  </div>

  <script src="../js/main.js"></script>
  <script>
    function checkStrength(pw) {
      const fill = document.getElementById("strengthFill");
      const text = document.getElementById("strengthText");
      let score = 0;
      if (pw.length >= 8)  score++;
      if (/[A-Z]/.test(pw)) score++;
      if (/[0-9]/.test(pw)) score++;
      if (/[^A-Za-z0-9]/.test(pw)) score++;
      const map = [
        { w:"0%",   bg:"transparent", t:"Enter a password" },
        { w:"25%",  bg:"#ef4444",     t:"Weak" },
        { w:"50%",  bg:"#f97316",     t:"Fair" },
        { w:"75%",  bg:"#facc15",     t:"Good" },
        { w:"100%", bg:"#22c55e",     t:"Strong 💪" },
      ];
      fill.style.width      = map[score].w;
      fill.style.background = map[score].bg;
      text.textContent      = map[score].t;
      text.style.color      = map[score].bg;
    }

    function doRegister() {
      const fn = document.getElementById("firstName").value.trim();
      const em = document.getElementById("regEmail").value.trim();
      const pw = document.getElementById("regPass").value;
      if (!fn || !em || !pw) { showToast("⚠️ Please fill in all fields"); return; }
      if (pw.length < 6) { showToast("⚠️ Password too short"); return; }
      showToast("🎉 Account created! Welcome to Shopora!");
      setTimeout(() => window.location.href = "../index.html", 1200);
    }
  </script>
</body>
</html>
